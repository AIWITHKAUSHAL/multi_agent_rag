<text x="1856" y="54" font-family="Menlo,Consolas,monospace" font-size="16" fill="#617783" font-weight="400" text-anchor="end" letter-spacing="0">03 / 04</text>
<text x="64" y="118" font-family="Arial,Helvetica,sans-serif" font-size="48" fill="#172e38" font-weight="700" text-anchor="start" letter-spacing="0">How a document becomes evidence</text>
<text x="64" y="160" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#617783" font-weight="400" text-anchor="start" letter-spacing="0">The upload path builds the library once. The question path searches the same persistent vectors.</text>
