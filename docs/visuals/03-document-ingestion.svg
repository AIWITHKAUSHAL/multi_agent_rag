<text x="88" y="256" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#69ad9b" font-weight="700" text-anchor="start" letter-spacing="1.4">01 / SELECT FILE</text>
<text x="88" y="293" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#172e38" font-weight="700" text-anchor="start" letter-spacing="0">static/app.js</text>
<text x="88" y="327" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#617783" font-weight="400" text-anchor="start" letter-spacing="0">uploadFiles(files)</text>
<text x="88" y="354" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#617783" font-weight="400" text-anchor="start" letter-spacing="0">FormData → POST /api/documents</text>
<text x="88" y="381" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#617783" font-weight="400" text-anchor="start" letter-spacing="0">PDF, UTF-8 TXT, or Markdown</text>
<rect x="524" y="224" width="412" height="188" rx="16" fill="#ffffff" stroke="#cfdad9"/>
<rect x="525" y="243" width="4" height="150" rx="2" fill="#69ad9b" stroke="none"/>
<text x="548" y="256" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#69ad9b" font-weight="700" text-anchor="start" letter-spacing="1.4">02 / VALIDATE UPLOAD</text>
<text x="548" y="293" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#172e38" font-weight="700" text-anchor="start" letter-spacing="0">app/main.py</text>
<text x="548" y="327" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#617783" font-weight="400" text-anchor="start" letter-spacing="0">upload(file)</text>
<text x="548" y="354" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#617783" font-weight="400" text-anchor="start" letter-spacing="0">size / library limits + upload lock</text>
<text x="548" y="381" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#617783" font-weight="400" text-anchor="start" letter-spacing="0">to_thread(retriever.ingest, ...)</text>
<rect x="984" y="224" width="412" height="188" rx="16" fill="#ffffff" stroke="#cfdad9"/>
