<text x="1008" y="585" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#172e38" font-weight="700" text-anchor="start" letter-spacing="0">data/classroom.db</text>
<text x="1008" y="619" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#617783" font-weight="400" text-anchor="start" letter-spacing="0">document ID / name / digest</text>
<text x="1008" y="646" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#617783" font-weight="400" text-anchor="start" letter-spacing="0">page / position / start / end</text>
