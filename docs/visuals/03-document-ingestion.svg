<text x="1008" y="293" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#172e38" font-weight="700" text-anchor="start" letter-spacing="0">app/retrieval.py</text>
<text x="1008" y="327" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#617783" font-weight="400" text-anchor="start" letter-spacing="0">Retriever.ingest(name, bytes)</text>
<text x="1008" y="354" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#617783" font-weight="400" text-anchor="start" letter-spacing="0">extract_pages() → page text</text>
<text x="1008" y="381" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#617783" font-weight="400" text-anchor="start" letter-spacing="0">PDF page numbers are preserved</text>
