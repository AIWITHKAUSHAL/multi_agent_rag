<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
<title id="title">Relay six-agent RAG architecture</title><desc id="desc">User query passes through supervisor, planning, retrieval, tool, execution and reflection agents. Documents flow through extraction, chunking and local embeddings into persistent vectors. Critic can request one revision. All agents emit trace events.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#7a896f" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="740" rx="18" fill="#f6f5f1"/>
<g font-family="Arial, sans-serif" fill="#252d2a"><text x="48" y="59" font-size="30" font-weight="bold">relay.</text><text x="158" y="56" font-size="14" letter-spacing="2" fill="#7a896f">SIX SPECIALISTS · ONE OBSERVABLE PIPELINE</text>
<text x="48" y="103" font-size="15" fill="#737e6c">Live EURI / Gemini generation · local semantic embeddings · persistent evidence and traces</text>
<g stroke="#d7ddce" fill="#fffefa"><rect x="420" y="130" width="360" height="46" rx="9"/>
<rect x="420" y="205" width="360" height="53" rx="9"/><rect x="420" y="287" width="360" height="53" rx="9"/>
