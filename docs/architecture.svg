<rect x="420" y="533" width="360" height="53" rx="9"/><rect x="420" y="615" width="360" height="53" rx="9"/>
<rect x="48" y="205" width="290" height="53" rx="9"/><rect x="48" y="287" width="290" height="53" rx="9"/><rect x="48" y="369" width="290" height="53" rx="9"/>
<rect x="862" y="205" width="290" height="92" rx="9"/><rect x="862" y="369" width="290" height="65" rx="9"/><rect x="862" y="478" width="290" height="78" rx="9"/>
<rect x="862" y="611" width="290" height="62" rx="9" fill="#eef2e9"/></g>
<g text-anchor="middle" font-size="16"><text x="600" y="159">User query + conversation history</text>
<text x="600" y="237">01   Supervisor / Router Agent</text><text x="600" y="319">02   Planning Agent</text>
<text x="600" y="401">03   RAG / Retrieval Agent</text><text x="600" y="483">04   Tool Agent</text>
<text x="600" y="565">05   Execution Agent</text><text x="600" y="647">06   Reflection / Critic Agent</text>
<text x="193" y="237">Upload PDF, TXT or Markdown</text><text x="193" y="309">Extract pages → overlapping chunks</text><text x="193" y="328" font-size="12" fill="#7a896f">Local BGE embeddings · 384 dimensions</text>
<text x="193" y="393">SQLite vectors + chunk metadata</text><text x="193" y="412" font-size="12" fill="#7a896f">Cosine similarity · Top-K · page references</text>
<text x="1007" y="233">Persisted run events</text><text x="1007" y="256" font-size="13" fill="#7a896f">Agent, reason, passages, tools, usage</text><text x="1007" y="279" font-size="13" fill="#7a896f">SSE → live UI → JSON export</text>
<text x="1007" y="395">Allowlisted tools</text><text x="1007" y="417" font-size="13" fill="#7a896f">Calculator · clock · date difference</text>
<text x="1007" y="507">EURI / Gemini</text><text x="1007" y="531" font-size="13" fill="#7a896f">Role prompts + validated JSON contracts</text>
<text x="1007" y="637">Final answer + source citations</text><text x="1007" y="658" font-size="12" fill="#7a896f">Or explicit refusal / needs review</text></g>
<g stroke="#7a896f" stroke-width="1.5" fill="none" marker-end="url(#arrow)"><path d="M600 176V200"/><path d="M600 258V282"/><path d="M600 340V364"/><path d="M600 422V446"/><path d="M600 504V528"/><path d="M600 586V610"/>
