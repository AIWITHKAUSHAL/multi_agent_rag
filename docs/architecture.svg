<text x="48" y="474" font-size="14" fill="#7a896f">Documents are evidence, not instructions.</text><text x="48" y="498" font-size="14" fill="#7a896f">Empty retrieval → grounded abstention.</text>
<text x="48" y="610" font-size="14" fill="#d7663e">Critic rejects?</text><text x="48" y="633" font-size="14" fill="#7a896f">One bounded revision, then re-check.</text>
<text x="48" y="706" font-size="12" fill="#909884">Patterns: routing · plan-and-execute · RAG · tool use · sequential handoffs · reflection · session memory</text></g></svg>
